<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVA | متجر إلكتروني عصري</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Tahoma,sans-serif}
body{background:#070711;color:#fff;min-height:100vh}button{cursor:pointer}
header{position:sticky;top:0;z-index:1000;height:75px;display:flex;align-items:center;justify-content:space-between;padding:0 6%;background:rgba(7,7,17,.85);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.08)}
.logo{font-size:30px;font-weight:bold;background:linear-gradient(90deg,#7c3cff,#00d4ff,#ff36c8);-webkit-background-clip:text;color:transparent}
nav{display:flex;gap:25px}nav button{border:0;background:none;color:#ccc;font-size:15px}
.header-actions{display:flex;gap:10px}.icon-btn{border:1px solid rgba(255,255,255,.1);background:#11111d;color:white;width:43px;height:43px;border-radius:13px;position:relative}
.cart-badge{position:absolute;top:-5px;right:-5px;background:#ff36c8;color:#fff;font-size:11px;padding:2px 6px;border-radius:20px;font-weight:bold}
.hero{min-height:620px;padding:100px 7%;display:flex;align-items:center;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;width:500px;height:500px;background:#7c3cff;filter:blur(150px);opacity:.25;top:-100px;right:-100px}
.hero-content{position:relative;z-index:2;max-width:750px}
.badge{display:inline-block;padding:10px 18px;border-radius:30px;background:rgba(124,60,255,.12);border:1px solid rgba(124,60,255,.35);color:#bca4ff;margin-bottom:25px}
.hero h1{font-size:70px;line-height:1.05;margin-bottom:25px}
.gradient{background:linear-gradient(90deg,#7c3cff,#00d4ff,#ff36c8);-webkit-background-clip:text;color:transparent}
.hero p{color:#aaa;font-size:19px;line-height:2;max-width:650px}
.primary{border:0;padding:15px 30px;border-radius:14px;color:white;font-weight:bold;background:linear-gradient(90deg,#7c3cff,#00aaff)}
.section{padding:70px 7%}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:35px}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:22px}
.product{background:linear-gradient(145deg,#11111d,#0c0c16);border:1px solid rgba(255,255,255,.08);border-radius:22px;overflow:hidden;transition:.3s}
.product-image{height:220px;background:#151523;display:flex;align-items:center;justify-content:center;overflow:hidden}
.product-image img{width:100%;height:100%;object-fit:cover}
.product-body{padding:20px}.category{color:#8e8eaa;font-size:13px}.price{font-size:22px;font-weight:bold;margin:15px 0;color:#00d4ff}
.product-buttons{display:flex;gap:8px}.product-buttons button{flex:1;padding:11px;border-radius:10px;border:0;background:#7c3cff;color:#fff}
.cart{position:fixed;top:0;left:-420px;width:400px;height:100vh;background:#0c0c16;z-index:3000;transition:.3s;padding:25px;overflow-y:auto}.cart.open{left:0}
.cart-item{display:flex;gap:12px;padding:15px 0;border-bottom:1px solid #252535;align-items:center}
.cart-item img{width:65px;height:65px;object-fit:cover;border-radius:10px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:2500;opacity:0;visibility:hidden;transition:.3s}.overlay.open{opacity:1;visibility:visible}
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:4000;background:rgba(0,0,0,.7);padding:20px}.modal.open{display:flex}
.modal-box{background:#11111d;border-radius:22px;padding:30px;max-width:520px;width:100%;border:1px solid rgba(255,255,255,.08)}
footer{margin-top:50px;padding:50px 7%;background:#050509;border-top:1px solid rgba(255,255,255,.08);color:#888;text-align:center}
</style>
</head>
<body>
<header><div class="logo">NOVA</div><nav><button onclick="scrollToSection('productsSection')">المتجر</button></nav><div class="header-actions"><button class="icon-btn" onclick="openCart()">🛒<span class="cart-badge" id="cartBadge">0</span></button></div></header>
<section class="hero" id="home"><div class="hero-content"><span class="badge">✨ تجربة تسوق من الجيل الجديد</span><h1>اكتشف عالمًا <span class="gradient">مختلفًا</span></h1><p>متجر NOVA يجمع بين التصميم العصري، المنتجات المميزة، وتجربة شراء سهلة وسريعة.</p></div></section>
<section class="section" id="productsSection"><div class="section-title"><div><h2>منتجاتنا</h2></div></div><div class="products" id="productsContainer"><p>جاري التحميل...</p></div></section>
<div class="overlay" id="overlay" onclick="closeCart()"></div>
<div class="cart" id="cart"><div class="cart-head"><h2>🛒 السلة</h2><button class="icon-btn" onclick="closeCart()">✕</button></div><div class="cart-items" id="cartItems"></div><div class="cart-total">الإجمالي: <strong id="cartTotal">$0</strong></div></div>
<div class="modal" id="productModal"><div class="modal-box"><img id="modalImage" src=""><h2 id="modalName"></h2><span class="category" id="modalCategory"></span><p id="modalDesc" style="color:#aaa;margin:15px 0"></p><div class="price" id="modalPrice"></div><div style="display:flex;gap:10px"><button class="primary" style="flex:1" id="modalAddBtn">🛒 أضف للسلة</button><button class="secondary" style="flex:1" onclick="closeModal()">إغلاق</button></div></div></div>
<footer><h2 class="logo">NOVA</h2><p style="margin-top:15px">متجر عصري بتجربة مختلفة.</p></footer>
<script type="module">
import { fetchProductsRealtime, fetchSettings, trackVisit, getCart, saveCart, saveOrderDB, saveCustomerDB } from "./data.js";
let products = []; let cart = getCart(); trackVisit();
fetchProductsRealtime((list) => { products = list; renderProducts(); });
fetchSettings((s) => { document.querySelectorAll(".logo").forEach(el => el.textContent = s.storeName || "NOVA"); });
function renderProducts() { const c = document.getElementById("productsContainer"); if (products.length === 0) { c.innerHTML = `<p style="text-align:center;width:100%">لا توجد منتجات حالياً</p>`; return; } c.innerHTML = products.map(p => `<div class="product"><div class="product-image"><img src="${p.image}" onerror="this.src='https://via.placeholder.com/600x400?text=NOVA'"></div><div class="product-body"><span class="category">${p.category}</span><h3>${p.name}</h3><div class="price">$${p.price}</div><div class="product-buttons"><button onclick="addToCart('${p.id}')">🛒 أضف للسلة</button></div></div></div>`).join(""); }
window.addToCart = function(id) { const p = products.find(x => x.id === id); if (!p) return; const ex = cart.find(x => x.id === id); if (ex) ex.qty = (ex.qty || 1) + 1; else cart.push({ ...p, qty: 1 }); saveCart(cart); renderCart(); updateBadge(); openCart(); };
window.removeFromCart = function(id) { cart = cart.filter(x => x.id !== id); saveCart(cart); renderCart(); updateBadge(); };
window.changeQty = function(id, delta) { const item = cart.find(x => x.id === id); if (!item) return; item.qty = (item.qty || 1) + delta; if (item.qty <= 0) return removeFromCart(id); saveCart(cart); renderCart(); updateBadge(); };
function renderCart() { const box = document.getElementById("cartItems"); if (cart.length === 0) { box.innerHTML = `<p style="text-align:center;padding:30px">السلة فارغة</p>`; document.getElementById("cartTotal").textContent = "$0"; return; } let total = 0; box.innerHTML = cart.map(item => { const qty = item.qty || 1; total += item.price * qty; return `<div class="cart-item"><img src="${item.image}"><div style="flex:1"><strong>${item.name}</strong><div style="color:#00d4ff">$${item.price}</div><div style="display:flex;gap:8px"><button class="qty-btn" onclick="changeQty('${item.id}',-1)">−</button><span>${qty}</span><button class="qty-btn" onclick="changeQty('${item.id}',1)">+</button></div></div><button class="qty-btn" style="background:#d92d20" onclick="removeFromCart('${item.id}')">✕</button></div>`; }).join(""); document.getElementById("cartTotal").textContent = "$" + total; }
function updateBadge() { document.getElementById("cartBadge").textContent = cart.reduce((s, x) => s + (x.qty || 1), 0); }
window.openCart = function() { document.getElementById("cart").classList.add("open"); document.getElementById("overlay").classList.add("open"); };
window.closeCart = function() { document.getElementById("cart").classList.remove("open"); document.getElementById("overlay").classList.remove("open"); };
window.closeModal = function() { document.getElementById("productModal").classList.remove("open"); };
window.scrollToSection = function(id) { document.getElementById(id).scrollIntoView({ behavior: "smooth" }); };
renderCart(); updateBadge();
</script>
</body>
</html>
